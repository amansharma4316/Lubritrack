<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sign in — Lubrication Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="login-card">
    <div class="login-mark"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/><circle cx="18.5" cy="5.5" r="2.5"/></svg></div>
    <h1>Lubrication Tracker</h1>
    <p id="login-sub">Sign in with your email and password.</p>

    <form id="login-form" autocomplete="on">
      <div class="fg" style="text-align:left;margin-bottom:12px">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="you@company.com" autocomplete="username" required>
      </div>
      <div class="fg" style="text-align:left;margin-bottom:6px">
        <label>Password</label>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <a href="#" class="auth-link" id="forgot-link" onclick="handleForgotPassword();return false;">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" id="login-btn" style="width:100%;justify-content:center">Sign in</button>
    </form>

    <div class="login-err" id="login-err"></div>
    <div class="login-ok" id="login-ok"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="supabase-client.js"></script>
<script src="login.js"></script>
</body>
</html>
